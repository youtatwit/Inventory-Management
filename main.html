<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar tool-bg" id="topbar">
    <button class="tool" type="button" title="Search" aria-label="Search">🔍</button>
    <button class="tool" type="button" title="Add" aria-label="Add">➕</button>
    <button class="tool" type="button" title="Settings" aria-label="Settings">⚙️</button>
  </div>

  <div class="topbar-hotspot" id="hotspot" aria-hidden="true"></div>

  <main class="content">
    <section class="page-header">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Inventory Items</h1>
        <p class="page-copy">
        </p>
      </div>

      <div class="header-actions">
        <button class="primary-btn" type="button">Filter</button>
      </div>
    </section>

    <section class="table-shell">
      <div class="table-toolbar">
        <div class="toolbar-left">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="Search items, category, supplier..."
            aria-label="Search inventory items"
          />
        </div>

        <div class="toolbar-right">
          <span class="results-count" id="resultsCount">0 items</span>
        </div>
      </div>

      <div class="table-wrap">
        <table class="inventory-table" aria-label="Inventory table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Category</th>
              <th scope="col">Status</th>
              <th scope="col">Qty</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
